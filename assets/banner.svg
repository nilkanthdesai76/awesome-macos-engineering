<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#141822"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d"/>
      <stop offset="50%" stop-color="#11998e"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2430" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#161922" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)" rx="16"/>

  <!-- Subdued grid pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="500" y1="0" x2="500" y2="420"/>
    <line x1="700" y1="0" x2="700" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1100" y1="0" x2="1100" y2="420"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="600" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" fill="url(#neon)" letter-spacing="1.5">AWESOME macOS ENGINEERING</text>
  <text x="600" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#8b949e" letter-spacing="0.5">Advanced AppKit Windowing · Display Topologies · Event Interception · Swift Concurrency</text>

  <!-- Pillar 1: Windowing & Panels -->
  <rect x="70" y="160" width="240" height="210" rx="12" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="105" cy="195" r="16" fill="#38ef7d" fill-opacity="0.15"/>
  <text x="105" y="201" text-anchor="middle" font-size="16" fill="#38ef7d">🪟</text>
  <text x="135" y="201" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">Windowing</text>
  <text x="90" y="240" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#8b949e">• Borderless NSPanel</text>
  <text x="90" y="268" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#8b949e">• Window levels (.mainMenu)</text>
  <text x="90" y="296" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#8b949e">• .canJoinAllSpaces</text>
  <text x="90" y="324" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#8b949e">• .fullScreenAuxiliary</text>

  <!-- Pillar 2: Screen & Notch -->
  <rect x="340" y="160" width="240" height="210" rx="12" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="375" cy="195" r="16" fill="#00c6ff" fill-opacity="0.15"/>
  <text x="375" y="201" text-anchor="middle" font-size="16" fill="#00c6ff">📐</text>
  <text x="405" y="201" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">Screen &amp; Notch</text>
  <text x="360" y="240" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#8b949e">• safeAreaInsets.top</text>
  <text x="360" y="268" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#8b949e">• auxiliaryTop Areas</text>
  <text x="360" y="296" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#8b949e">• Multi-display origins</text>
  <text x="360" y="324" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#8b949e">• Physical notch math</text>

  <!-- Pillar 3: Event Interception -->
  <rect x="610" y="160" width="240" height="210" rx="12" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="645" cy="195" r="16" fill="#e36fee" fill-opacity="0.15"/>
  <text x="645" y="201" text-anchor="middle" font-size="16" fill="#e36fee">⚡️</text>
  <text x="675" y="201" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">Event System</text>
  <text x="630" y="240" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#8b949e">• Global NSEvent monitors</text>
  <text x="630" y="268" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#8b949e">• Screen edge tracking</text>
  <text x="630" y="296" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#8b949e">• CoreGraphics CGEventTap</text>
  <text x="630" y="324" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#8b949e">• ignoresMouseEvents</text>

  <!-- Pillar 4: Concurrency & Mach-O -->
  <rect x="880" y="160" width="250" height="210" rx="12" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="915" cy="195" r="16" fill="#ffa116" fill-opacity="0.15"/>
  <text x="915" y="201" text-anchor="middle" font-size="16" fill="#ffa116">🔒</text>
  <text x="945" y="201" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">System APIs</text>
  <text x="900" y="240" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#8b949e">• App Sandbox exceptions</text>
  <text x="900" y="268" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#8b949e">• LSUIElement accessory</text>
  <text x="900" y="296" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#8b949e">• ScreenCaptureKit (SCStream)</text>
  <text x="900" y="324" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#8b949e">• Swift 6 Sendable actors</text>
</svg>
